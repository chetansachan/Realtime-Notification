upstream notify_api {
  server api-1:3000 max_fails=3 fail_timeout=5s;
  server api-2:3000 max_fails=3 fail_timeout=5s;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SSE: never buffer, long read timeout. Otherwise streams appear to hang.
  location /v1/stream {
    proxy_pass http://notify_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
  }

  location /v1/ws {
    proxy_pass http://notify_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /v1/ {
    proxy_pass http://notify_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /demo {
    proxy_pass http://notify_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://notify_api;
  }

  # Swagger UI from the API (optional but handy in a demo stack).
  location /docs {
    proxy_pass http://notify_api;
    proxy_set_header Host $host;
  }

  # SPA fallback for client-side routes (/playground, /docs are API-owned above).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
