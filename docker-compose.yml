x-app-env: &app-env
  DATABASE_URL: postgres://notify:notify@postgres:5432/notify
  REDIS_URL: redis://redis:6379
  JWT_SECRET: local-dev-only-secret-change-me-please
  LOG_LEVEL: info
  CORS_ORIGIN: '*'
  DEMO_ENABLED: 'true'
  DEMO_APP_ID: demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notify -d notify']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ['node', 'node_modules/.bin/node-pg-migrate', 'up', '-m', '/app/migrations']
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api-1:
    build: ./backend
    environment:
      <<: *app-env
      INSTANCE_ID: api-1
      PORT: '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  api-2:
    build: ./backend
    environment:
      <<: *app-env
      INSTANCE_ID: api-2
      PORT: '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ['node', 'dist/src/worker.js']
    environment:
      <<: *app-env
      INSTANCE_ID: worker-1
      WORKER_CONCURRENCY: '10'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '9464:9464'

  volumes:
  pgdata:
