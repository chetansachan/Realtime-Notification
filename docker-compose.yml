x-app-env: &app-env
  DATABASE_URL: postgres://notify:notify@postgres:5432/notify
  REDIS_URL: redis://redis:6379
  JWT_SECRET: local-dev-only-secret-change-me-please
  LOG_LEVEL: info
  CORS_ORIGIN: '*'
  DEMO_ENABLED: 'true'
  DEMO_APP_ID: demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notify -d notify']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  volumes:
  pgdata:
