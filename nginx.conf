worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Long-lived streams: one connection per browser tab per user.
  proxy_http_version 1.1;
  sendfile on;
  tcp_nopush on;

  log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';
  access_log /var/log/nginx/access.log upstream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream notify_api {
    # Round-robin on purpose: two tabs of the same user should land on
    # different instances, which is what makes the demo interesting.
    server api-1:3000 max_fails=3 fail_timeout=5s;
    server api-2:3000 max_fails=3 fail_timeout=5s;
  }

  server {
    listen 80;
    server_name _;

    # SSE: no buffering, no compression, long read timeout.
    location /v1/stream {
      proxy_pass http://notify_api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      chunked_transfer_encoding off;
    }

    # WebSocket upgrade.
    location /v1/ws {
      proxy_pass http://notify_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location / {
      proxy_pass http://notify_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
